services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: axm
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: axm
    volumes:
      - axm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axm -d axm"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  axm_postgres:
